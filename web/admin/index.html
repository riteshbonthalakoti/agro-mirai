<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO MIRAI — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="login-view" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <h1>AGRO MIRAI</h1>
    <p class="muted">Admin dashboard. Sign in with an admin account.</p>
    <label>Email <input type="email" name="email" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button type="submit">Sign in</button>
  </form>
</section>

<div id="app-view" hidden>
  <header class="topbar">
    <strong>AGRO MIRAI <span class="muted">/ Admin</span></strong>
    <nav>
      <a href="#/" id="nav-overview">Overview</a>
      <a href="#/farmers" id="nav-farmers">Farmers</a>
    </nav>
    <button id="logout" class="ghost">Sign out</button>
  </header>
  <main id="main"></main>
</div>

<script src="/admin.js"></script>
</body>
</html>
