openapi: 3.0.3
info:
  title: AGRO MIRAI API
  version: v1
  description: |
    Contract skeleton for the AGRO MIRAI HTTP API. This document defines
    the shape every endpoint will honour once Module 11 implements them;
    the frontend (Module 14) may type against it beforehand.

    Conventions: see docs/conventions.md. Enums: see specs/core/enums.md.
    Entity schemas mirror specs/core/schema.yaml.

servers:
  - url: https://api.agromirai.local/v1
    description: Placeholder; real hosts land in Module 11.

security:
  - bearerAuth: []

paths:

  /health:
    get:
      summary: Liveness check — returns service and data-store status.
      security: []
      responses:
        '200':
          description: Service is reachable (status may still be "degraded" if the data store is down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /farmers/me:
    get:
      summary: Get the authenticated farmer's profile.
      responses:
        '200':
          description: Farmer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farmer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /fields:
    get:
      summary: List Fields owned by the authenticated Farmer.
      responses:
        '200':
          description: A list of Fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Field' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a Field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldCreate' }
      responses:
        '201':
          description: The created Field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /fields/{field_id}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get a Field by id.
      responses:
        '200':
          description: The Field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fields/{field_id}/recommendation:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get the most recent CropRecommendation for a Field.
      responses:
        '200':
          description: The recommendation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropRecommendation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fields/{field_id}/irrigation:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get the most recent IrrigationAdvice for a Field.
      responses:
        '200':
          description: The advice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationAdvice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fields/{field_id}/disease-risk:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: List DiseaseRiskAlerts for a Field.
      responses:
        '200':
          description: A list of alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiseaseRiskAlert' }
                required: [items]

  /fields/{field_id}/disease-risk/image:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    post:
      summary: |
        Module 21. Submit a leaf photo for CNN-based disease-risk
        classification. Calls the standalone CNN inference service
        (CNN_SERVICE_URL) with a bounded timeout; on any failure to
        reach it (unreachable, timeout, error), falls back to the
        existing rule-based environmental DiseaseRiskModel and still
        returns a valid 200 DiseaseRiskAlert — never a 500. The
        resulting alert's `source` field ("cnn" |
        "environmental_fallback") records which path was actually used.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/WEBP leaf photo, max 10MB.
              required: [image]
      responses:
        '200':
          description: The resulting alert (CNN or environmental-fallback path).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseRiskAlert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /fields/{field_id}/advisories:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: List Advisories for a Field.
      responses:
        '200':
          description: A list of advisories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Advisory' }
                required: [items]

  /feedback:
    post:
      summary: Submit farmer feedback on an Advisory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackEntryCreate' }
      responses:
        '201':
          description: The stored feedback entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- v2: multi-tenant session auth + read-only Admin (Module 19) ---
  # Session-cookie authenticated, not bearerAuth — see sessionCookie below.
  # decisions/0017-multi-tenant-v2.md. /v1 above is unchanged and stays
  # live for demo/backward-compat; these are additive new paths, not a
  # revision of the /v1 ones. Module 27: farmer auth is Name+Phone+OTP
  # (request-otp/verify-otp), not email+password — see
  # decisions/0023-name-phone-otp-auth.md. The admin-account
  # email+password login stays on /admin/login (server-rendered, not in
  # this API surface) since admin accounts are provisioned out-of-band.

  /v2/auth/request-otp:
    post:
      summary: >
        Find-or-create a Farmer by phone and issue a 6-digit OTP. New
        phone numbers require name (+ optional preferred_language);
        an already-registered phone can omit them. The OTP is not sent
        anywhere yet — it is written to the server's own log output
        (OTP_DELIVERY=log, dev/demo posture, see decisions/0023).
        Rate-limited per remote address (OTP_RATE_LIMIT).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
      responses:
        '200':
          description: OTP issued (delivery is via server logs today).
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone: { type: string }
                  otp_sent: { type: boolean }
                  is_new_farmer:
                    type: boolean
                    description: True if this phone had no existing farmer record (a fresh registration); false for a returning farmer. Lets the client route to a short profile-completion step only for first-time signups.
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Too many OTP requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v2/auth/verify-otp:
    post:
      summary: Verify the OTP for a phone number; issues a signed session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Logged in; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farmer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v2/auth/logout:
    post:
      summary: Clear the current session.
      security: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /v2/farmers/me:
    get:
      summary: Get the session-authenticated Farmer's own profile.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: Farmer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farmer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update the session-authenticated Farmer's own profile.
      description: |
        Partial update — only keys present in the body are changed.
        Mutable fields: ``name``, ``preferred_language``, ``photo_url``.
        Email and password changes are out of scope for v1 (see ADR 0017 known limitations).
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                preferred_language:
                  type: string
                  enum: [en, kn, te, hi]
                  description: Must be one of V1_LANGUAGES — the languages the voice stack can act on (Module 25).
                photo_url:
                  type: string
                  description: Module 30. A base64 data URI (e.g. "data:image/jpeg;base64,..."). Small images only, downscaled/compressed client-side.
              minProperties: 1
      responses:
        '200':
          description: Updated Farmer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farmer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/fields:
    get:
      summary: List Fields owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of Fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Field' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a Field owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldCreate' }
      responses:
        '201':
          description: The created Field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/fields/{field_id}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get a Field by id. 404 (not 403) if it exists but is owned by a different Farmer — no cross-tenant existence leak.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: The Field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: |
        Module 23 (A5). Partial update of a Field owned by the
        session-authenticated Farmer — only the keys present in the body
        are changed. /v1 deliberately does not get this route (frozen
        per ADR 0017); no /v1 caller has ever needed field mutation.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldUpdate' }
      responses:
        '200':
          description: The updated Field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: |
        Delete a Field owned by the session-authenticated Farmer.
        All linked data (advisories, soil samples, weather readings, NDVI
        readings, irrigation advice, disease risk alerts, feedback) is
        cascade-deleted per the SQLite/Postgres migration's ON DELETE CASCADE.
        Returns 204 on success, 404 if not found or owned by a different Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '204':
          description: Field deleted successfully. No response body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- v2: value endpoints + voice (Module 23) ---
  # Blocker A: everything below /v2/fields/{field_id}/... and /v2/feedback
  # carries the product's actual value and previously existed only under
  # /v1's single shared FARMER_ID — these are the session-authenticated
  # equivalents, sharing their handler bodies with /v1 (never their route
  # registration) via agro_mirai.api.value_endpoints — see
  # decisions/0020-v2-value-endpoints-and-voice-api.md.

  /v2/fields/{field_id}/refresh-data:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    post:
      summary: >-
        Module 34 follow-up 2: manually re-pull real weather/soil/NDVI
        data for a Field owned by the session-authenticated Farmer via
        the Module 03 acquisition adapters, the same call field creation
        makes. Weather/soil are fetched synchronously; NDVI is fetched in
        a background thread and is not reflected in this response
        (data_acquisition.ndvi is always "gathering"). No automatic
        periodic refresh exists — this manual trigger is the deliberate
        MVP, not a placeholder for a scheduler.
      security: [ { sessionCookie: [] } ]
      responses:
        '202':
          description: Refresh accepted; weather/soil status reflects the synchronous portion, NDVI is still in flight.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id: { type: string }
                  data_acquisition:
                    type: object
                    properties:
                      weather: { type: string, enum: [ready, unavailable] }
                      soil: { type: string, enum: [ready, unavailable] }
                      ndvi: { type: string, enum: [gathering] }
                    required: [weather, soil, ndvi]
                required: [field_id, data_acquisition]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/fields/{field_id}/recommendation:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get the most recent CropRecommendation for a Field owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: The recommendation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v2/fields/{field_id}/irrigation:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: Get the most recent IrrigationAdvice for a Field owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: The advice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationAdvice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v2/fields/{field_id}/disease-risk:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: List DiseaseRiskAlerts for a Field owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiseaseRiskAlert' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v2/fields/{field_id}/disease-risk/image:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    post:
      summary: Session-authenticated equivalent of POST /fields/{field_id}/disease-risk/image (Module 21). Same CNN-vs-environmental-fallback contract — see that path's description.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/WEBP leaf photo, max 10MB.
              required: [image]
      responses:
        '200':
          description: The resulting alert (CNN or environmental-fallback path).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseRiskAlert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v2/fields/{field_id}/advisories:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      summary: List Advisories for a Field owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of advisories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Advisory' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /v2/feedback:
    post:
      summary: Submit farmer feedback on an Advisory owned by the session-authenticated Farmer.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackEntryCreate' }
      responses:
        '201':
          description: The stored feedback entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/bug-reports:
    post:
      summary: Submit a farmer-facing in-app bug report (not tied to a specific Advisory).
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugReportCreate' }
      responses:
        '201':
          description: The stored bug report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/advisories/{advisory_id}/audio:
    parameters:
      - name: advisory_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: language
        in: query
        required: false
        description: Overrides the farmer's preferred_language for this request. Must be one of V1_LANGUAGES (en, kn, te, hi).
        schema: { type: string, enum: [en, kn, te, hi] }
    get:
      summary: |
        Module 23 (Blocker B). Spoken audio for one Advisory, in the
        farmer's preferred_language unless overridden by ?language=.
        Translates first (via the voice service) when the requested
        language differs from the language the Advisory was generated
        in. Calls the standalone Oracle-hosted voice service
        (VOICE_SERVICE_URL) with a bounded timeout; on any failure to
        reach it, returns 503 VOICE_UNAVAILABLE — never a 500, never a
        silent empty body — so the mobile client can fall back to
        on-device TTS. Response is OGG/Vorbis audio
        (services/voice transcodes from Piper's native WAV) with an
        ETag/Cache-Control pair so the client can cache aggressively and
        revalidate cheaply, matching the decided pre-cache design.
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: Spoken audio for the advisory.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        '304':
          description: Not modified — the client's If-None-Match ETag still matches.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Voice service unreachable/unconfigured. The client should fall back to on-device TTS. Body uses ErrorEnvelope with code VOICE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v2/stt:
    post:
      summary: |
        Module 23 (Blocker B). Speech-to-text: uploads an audio clip
        (WAV/OGG/MP3, max 10MB), returns the transcribed text and
        detected language. Same VOICE_UNAVAILABLE 503 degradation
        contract as the audio endpoint above — the client should fall
        back to on-device STT or manual text entry.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV/OGG/MP3 clip, max 10MB.
                expected_lang:
                  type: string
                  enum: [en, kn, te, hi]
                  description: Optional hint for the ASR model. Must be one of V1_LANGUAGES.
              required: [audio]
      responses:
        '200':
          description: Transcription result.
          content:
            application/json:
              schema:
                type: object
                required: [text, detected_lang]
                properties:
                  text: { type: string }
                  detected_lang: { type: string, enum: [en, hi, kn, ta, te, mr, bn, gu] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Voice service unreachable/unconfigured. The client should fall back to on-device STT/text entry. Body uses ErrorEnvelope with code VOICE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v2/voice/ask:
    post:
      summary: |
        Module 30, candidate (a) (decisions/0024-realtime-voice-ai-research.md).
        A farmer asks a question by voice; the answer is grounded in this
        farmer's own real fields/advisories, not a generic LLM reply.
        Composes existing STT (Module 12) with one new Gemini text call
        (scoped to this farmer's own DataStore rows only — never another
        farmer's data) and existing TTS (Module 12/25). If the voice
        service is reachable but Gemini isn't, returns 503
        LLM_UNAVAILABLE; if the reverse, returns 503 VOICE_UNAVAILABLE.
        If Gemini succeeds but TTS fails, still returns 200 with
        answer_audio_base64: null so the client can speak answer_text via
        on-device TTS instead of losing the answer outright.
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV/OGG/MP3 clip of the farmer's spoken question, max 10MB.
                expected_lang:
                  type: string
                  enum: [en, kn, te, hi]
                  description: Optional hint for the ASR model. Must be one of V1_LANGUAGES.
              required: [audio]
      responses:
        '200':
          description: The transcribed question, the grounded answer, and (if TTS succeeded) spoken audio for the answer.
          content:
            application/json:
              schema:
                type: object
                required: [question_text, detected_lang, answer_text, language]
                properties:
                  question_text: { type: string }
                  detected_lang: { type: string, enum: [en, hi, kn, ta, te, mr, bn, gu] }
                  answer_text: { type: string }
                  language: { type: string, enum: [en, kn, te, hi] }
                  answer_audio_base64: { type: string, nullable: true, description: Base64-encoded OGG/Vorbis audio, or null if TTS was unavailable. }
                  answer_audio_mimetype: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Voice service or LLM unreachable/unconfigured. Body uses ErrorEnvelope with code VOICE_UNAVAILABLE or LLM_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v2/admin/farmers:
    get:
      summary: 'Admin only: list every Farmer with their field count. Read-only.'
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of Farmers, each with an additional field_count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminFarmerSummary' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/admin/fields:
    get:
      summary: 'Admin only: list every Field across every Farmer. Read-only.'
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of Fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Field' }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/admin/feedback:
    get:
      summary: 'Admin only: system-wide feedback aggregates (all Farmers). Read-only.'
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: Aggregated feedback report (same shape as Module 13's per-farmer aggregator, scoped to everyone).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/admin/scans:
    get:
      summary: 'Admin only: every image-upload disease scan (source cnn or environmental_fallback) across all Farmers, newest first, each with farmer_id and field_name. Read-only.'
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of DiseaseRiskAlerts with additional farmer_id and field_name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/admin/advisories:
    get:
      summary: 'Admin only: advisories across all Farmers, newest first, each with farmer_id and field_name. Read-only.'
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: A list of Advisories with additional farmer_id and field_name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Flask signed session cookie issued by POST /v2/auth/login (Module 19). Not a bearer token — the cookie is opaque and itsdangerous-signed.

  parameters:
    FieldId:
      name: field_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found or not owned by the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated, but not permitted (e.g. non-admin calling an /v2/admin route).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Well-formed request, but the field's data isn't sufficient to compute a result (e.g. no weather data yet).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Farmer:
      type: object
      required: [id, created_at, updated_at, name, preferred_language]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
        preferred_language:
          type: string
          enum: [en, hi, kn, ta, te, mr, bn, gu]
        phone: { type: string, nullable: true }
        district: { type: string, nullable: true }
        state: { type: string, nullable: true }
        email:
          type: string
          format: email
          nullable: true
          description: Module 19. Present for farmers registered via /v2. Never accompanied by password_hash in a response.
        role:
          type: string
          enum: [farmer, admin]
          nullable: true
          description: Module 19. Absent/defaults to "farmer" for pre-Module-19 records.
        photo_url:
          type: string
          nullable: true
          description: Module 30. A base64 data URI -- no file-storage service exists yet, so the profile photo is stored directly rather than as a link to one.

    RequestOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: "E.164-ish, 7-15 digits, optional leading +." }
        name: { type: string, description: Required only the first time this phone requests an OTP. }
        preferred_language:
          type: string
          enum: [en, kn, te, hi]
          description: >
            Only consulted the first time this phone requests an OTP
            (new-farmer creation); ignored on later requests for an
            already-registered phone. Restricted to V1_LANGUAGES (the
            voice-operational set), not the broader 8-language
            enums.md list.

    VerifyOtpRequest:
      type: object
      required: [phone, otp]
      properties:
        phone: { type: string }
        otp: { type: string, description: The 6-digit code issued by /v2/auth/request-otp. }

    AdminFarmerSummary:
      description: A Farmer plus the one admin-only aggregate field.
      allOf:
        - { $ref: '#/components/schemas/Farmer' }
        - type: object
          required: [field_count]
          properties:
            field_count: { type: integer, minimum: 0 }

    Field:
      type: object
      required: [id, farmer_id, created_at, updated_at, name, latitude, longitude, area_ha]
      properties:
        id: { type: string, format: uuid }
        farmer_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        area_ha: { type: number, minimum: 0 }
        elevation_m: { type: number, nullable: true }
        soil_type:
          type: string
          nullable: true
          enum: [alluvial, black, red, laterite, mountain, desert, saline, peaty, unknown]
        current_crop:
          type: string
          nullable: true
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        sown_on: { type: string, format: date, nullable: true }

    FieldCreate:
      type: object
      required: [name, latitude, longitude, area_ha]
      properties:
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        area_ha: { type: number, minimum: 0 }
        elevation_m: { type: number }
        soil_type:
          type: string
          enum: [alluvial, black, red, laterite, mountain, desert, saline, peaty, unknown]
        current_crop:
          type: string
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        sown_on: { type: string, format: date }

    FieldUpdate:
      description: Module 23 (A5). Every property optional (partial update); at least one must be present.
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        area_ha: { type: number, minimum: 0 }
        elevation_m: { type: number, nullable: true }
        soil_type:
          type: string
          nullable: true
          enum: [alluvial, black, red, laterite, mountain, desert, saline, peaty, unknown]
        current_crop:
          type: string
          nullable: true
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        sown_on: { type: string, format: date, nullable: true }

    FieldUpdate:
      description: Module 23 (A5). Every property optional (partial update); at least one must be present.
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        area_ha: { type: number, minimum: 0 }
        elevation_m: { type: number, nullable: true }
        soil_type:
          type: string
          nullable: true
          enum: [alluvial, black, red, laterite, mountain, desert, saline, peaty, unknown]
        current_crop:
          type: string
          nullable: true
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        sown_on: { type: string, format: date, nullable: true }

    CropRecommendation:
      type: object
      required: [id, field_id, created_at, recommended_crop, confidence]
      properties:
        id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        recommended_crop:
          type: string
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        confidence: { type: number, minimum: 0, maximum: 1 }
        alternatives:
          type: array
          items:
            type: string
            enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]
        rationale: { type: string }
        season:
          type: string
          enum: [kharif, rabi, zaid]
        out_of_region: { type: boolean }
        regional_alternative:
          type: string
          enum: [rice, maize, chickpea, kidneybeans, pigeonpeas, mothbeans, mungbean, blackgram, lentil, pomegranate, banana, mango, grapes, watermelon, muskmelon, apple, orange, papaya, coconut, cotton, jute, coffee]

    IrrigationAdvice:
      type: object
      required: [id, field_id, created_at, recommended_depth_mm, window_start_at, window_end_at, urgency]
      properties:
        id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        recommended_depth_mm: { type: number, minimum: 0 }
        window_start_at: { type: string, format: date-time }
        window_end_at: { type: string, format: date-time }
        urgency:
          type: string
          enum: [low, moderate, high, severe]
        rationale: { type: string }

    DiseaseRiskAlert:
      type: object
      required: [id, field_id, created_at, disease, risk_level, confidence]
      properties:
        id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        disease: { type: string }
        risk_level:
          type: string
          enum: [low, moderate, high, severe]
        confidence: { type: number, minimum: 0, maximum: 1 }
        window_start_at: { type: string, format: date-time }
        window_end_at: { type: string, format: date-time }
        recommended_action: { type: string }
        source:
          type: string
          description: Module 21 additive. Which path produced this alert.
          enum: [cnn, environmental, environmental_fallback]

    Advisory:
      type: object
      required: [id, field_id, created_at, language, title, body, severity]
      properties:
        id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        language:
          type: string
          enum: [en, hi, kn, ta, te, mr, bn, gu]
        title: { type: string }
        body: { type: string }
        severity:
          type: string
          enum: [low, moderate, high, severe]
        source_refs:
          type: array
          items: { type: string, format: uuid }

    FeedbackEntry:
      type: object
      required: [id, farmer_id, advisory_id, created_at, rating, helpful]
      properties:
        id: { type: string, format: uuid }
        farmer_id: { type: string, format: uuid }
        advisory_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        rating: { type: integer, minimum: 1, maximum: 5 }
        helpful: { type: boolean }
        comment: { type: string }

    FeedbackEntryCreate:
      type: object
      required: [advisory_id, rating, helpful]
      properties:
        advisory_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        helpful: { type: boolean }
        comment: { type: string }

    BugReport:
      type: object
      required: [id, farmer_id, created_at]
      properties:
        id: { type: string, format: uuid }
        farmer_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        category:
          type: string
          enum: [crash, wrong_info, unclear_advice, photo_scan_failed, login_failed, other]
        message: { type: string }
        photo_url: { type: string }
        app_version: { type: string }
        platform: { type: string }

    BugReportCreate:
      type: object
      description: At least one of category/message is required (enforced server-side, not by an "at least one" JSON Schema construct here).
      properties:
        category:
          type: string
          enum: [crash, wrong_info, unclear_advice, photo_scan_failed, login_failed, other]
        message: { type: string }
        photo_url: { type: string }
        app_version: { type: string }
        platform: { type: string }
