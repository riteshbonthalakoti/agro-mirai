name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Train model artifacts
        run: |
          python tools/train_crop_model.py
          python tools/train_irrigation_model.py

      - name: Check specs contracts
        run: python tools/check_specs.py

      # test_open_meteo_live_forecast_call / test_soilgrids_live_call hit
      # real external APIs and are flaky on hosted runners (observed:
      # api.open-meteo.com read-timeout even though the runner has
      # general network access) — deselected here, not silently dropped;
      # they still run locally, gated by their own _network_available()
      # check.
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: >-
          pytest --ignore=tests/voice --ignore=tests/vision
          --ignore=services/cnn-inference --ignore=services/voice
          --deselect tests/test_module_03_acquisition.py::test_open_meteo_live_forecast_call
          --deselect tests/test_module_03_acquisition.py::test_soilgrids_live_call

      # Module 12's voice/AI4Bharat stack (torch, transformers, etc.) needs
      # the project-local .venv/ with transformers pinned to 4.49.0 — see
      # docs/architecture.md. Installing and running it in CI within a
      # reasonable time/cost budget wasn't attempted; tests/voice/ is
      # skipped here deliberately, not silently dropped.

      # Module 21 — the CNN inference service's own route tests use a
      # stub model (no torch dependency), so they can run in the same job
      # as the main suite without installing torch/torchvision here.
      - name: Run CNN inference service tests
        run: pytest services/cnn-inference/tests -q

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check src tools tests
