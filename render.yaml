services:
  - type: web
    name: agro-mirai
    runtime: python
    repo: https://github.com/riteshbonthalakoti/agro-mirai
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: 'PYTHONPATH=src gunicorn -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT "agro_mirai.api.app:create_app()"'
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TABULAR_SERVICE_URL
        value: https://agro-mirai-tabular.onrender.com
      - key: CNN_SERVICE_URL
        value: https://agro-mirai-cnn.onrender.com
      - key: CNN_SERVICE_TIMEOUT_S
        value: "15"
      - key: VOICE_SERVICE_TIMEOUT_S
        value: "30"
      - key: OTP_RATE_LIMIT
        value: 5 per minute
      - key: TTS_RATE_LIMIT
        value: 20 per minute
      - key: STT_RATE_LIMIT
        value: 10 per minute
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: API_KEY
        sync: false
      - key: FARMER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SARVAM_API_KEY_1
        sync: false
      - key: SARVAM_API_KEY_2
        sync: false
      - key: SARVAM_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: VOICE_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: agro-mirai-cnn
    runtime: python
    repo: https://github.com/riteshbonthalakoti/agro-mirai
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r services/cnn-onnx/requirements.txt
    startCommand: 'PYTHONPATH=src:services/cnn-onnx gunicorn -w 1 --threads 2 --timeout 180 -b 0.0.0.0:$PORT app:app'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CNN_SERVICE_TOKEN
        sync: false

  - type: web
    name: agro-mirai-tabular
    runtime: python
    repo: https://github.com/riteshbonthalakoti/agro-mirai
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r services/tabular-ml/requirements.txt
    startCommand: 'PYTHONPATH=src:services/tabular-ml gunicorn -w 1 --threads 2 --timeout 120 -b 0.0.0.0:$PORT app:app'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
